name: Android-APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: eigener Signaturschlüssel aus den Repository-Secrets (siehe README).
      # Ohne ihn wird die APK mit einem Debug-Schlüssel signiert.
      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Eigener Signaturschlüssel wird verwendet."
          else
            echo "Kein Signaturschlüssel hinterlegt – Debug-Signatur wird verwendet."
          fi

      - name: Tests ausführen und APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Arbeitszeitrechner-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Arbeitszeitrechner-apk
          path: Arbeitszeitrechner-*.apk

      # Auf dem Standard-Branch wird automatisch ein Release mit der APK erstellt,
      # das man direkt auf dem Handy herunterladen kann.
      - name: Release veröffentlichen
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Arbeitszeitrechner 1.0.${{ github.run_number }}
          files: Arbeitszeitrechner-*.apk
          make_latest: true
