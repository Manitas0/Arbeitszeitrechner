# Baut Android- und iOS-App. Der Dateiname bleibt "android.yml", damit die
# Build-Nummer (Versionscode der Android-App) weiter hochzählt.
name: Apps bauen

on:
  push:
    paths-ignore:
      - 'web/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/web.yml'
  pull_request:
    paths-ignore:
      - 'web/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      screenshots_in_log:
        description: 'iOS-Bildschirmfotos zusätzlich verkleinert als Base64 ins Log schreiben'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: eigener Signaturschlüssel aus den Repository-Secrets (siehe README).
      # Ohne ihn wird die APK mit einem Debug-Schlüssel signiert.
      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Eigener Signaturschlüssel wird verwendet."
          else
            echo "Kein Signaturschlüssel hinterlegt – Debug-Signatur wird verwendet."
          fi

      - name: Tests ausführen und APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Arbeitszeitrechner-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Arbeitszeitrechner-apk
          path: Arbeitszeitrechner-*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Rechenlogik testen (Swift-Paket)
        run: bash ios/ci/build.sh kit-test

      - name: Xcode-Projekt erzeugen
        run: bash ios/ci/build.sh generate

      - name: App bauen (Simulator)
        run: bash ios/ci/build.sh build

      - name: Unsignierte IPA bauen (für Sideloadly)
        env:
          AZ_VERSION: 1.0.${{ github.run_number }}
          AZ_BUILD: ${{ github.run_number }}
        run: bash ios/ci/build.sh ipa

      - name: IPA benennen
        run: cp ios/build/Arbeitszeitrechner-iOS.ipa "Arbeitszeitrechner-iOS-1.0.${{ github.run_number }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Arbeitszeitrechner-ipa
          path: Arbeitszeitrechner-iOS-*.ipa

  # Bildschirmfotos aus dem Simulator (UI-Test) – zur Kontrolle der Oberfläche.
  ios-screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Projekt erzeugen
        run: bash ios/ci/build.sh generate

      - name: UI-Test mit Bildschirmfotos
        run: bash ios/ci/build.sh screenshots

      # Nur bei manuellem Start: Bilder ins Log, falls Artefakte nicht abrufbar sind.
      - name: Bildschirmfotos ins Log schreiben
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots_in_log
        run: |
          mkdir -p ios/build/screenshots-small
          for f in ios/build/screenshots/*.png; do
            name=$(basename "$f")
            sips -Z 900 "$f" --out "ios/build/screenshots-small/$name" > /dev/null
            echo "----- BEGIN $name -----"
            base64 -b 120 -i "ios/build/screenshots-small/$name"
            echo "----- END $name -----"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: warn

  # Auf dem Standard-Branch wird automatisch ein Release mit APK und IPA erstellt,
  # das man direkt auf dem Handy bzw. am PC herunterladen kann.
  release:
    needs: [android, ios]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Arbeitszeitrechner-*
          path: dist
          merge-multiple: true

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Arbeitszeitrechner 1.0.${{ github.run_number }}
          files: |
            dist/Arbeitszeitrechner-*.apk
            dist/Arbeitszeitrechner-iOS-*.ipa
          make_latest: true
